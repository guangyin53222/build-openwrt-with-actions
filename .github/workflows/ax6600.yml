name: Build qosmio NSS (RE-CS-02 + Athena LED + Plugins)

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: "开启多线程编译"
        type: boolean
        default: true
      ssh:
        description: "SSH 连接编译环境"
        type: boolean
        default: false
      isFiles:
        description: "使用 files 大法"
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout 当前仓库 (.config / diy.sh / files)
        uses: actions/checkout@v4

      - name: 2. 释放磁盘空间
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"

      - name: 3. 最大化磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 3072
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: 4. 安装编译依赖 (含 Rust)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl \
            device-tree-compiler fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf intltool libelf-dev libncurses5-dev \
            libssl-dev libtool lrzsz python3 python3-pip rsync scons \
            squashfs-tools subversion swig texinfo unzip vim wget \
            xmlto zlib1g-dev zstd
          # Rust 工具链 (athena-led 核心)
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: 5. Checkout qosmio/openwrt-ipq (写死分支)
        uses: actions/checkout@v4
        with:
          repository: qosmio/openwrt-ipq
          ref: qualcommax-6.x-nss-wifi-6.9
          path: openWRT

      - name: 6. 复制 .config 和 diy.sh 进源码
        run: |
          cp -f .config diy.sh openWRT/

      - name: 7. 复制 files/ (如果启用)
        if: ${{ inputs.isFiles == true }}
        run: |
          cp -r files openWRT/files

      - name: 8. feeds update + install
        working-directory: openWRT
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 9. 克隆 athena-led (点阵屏驱动)
        working-directory: openWRT
        run: |
          mkdir -p package/athena
          git clone --depth 1 https://github.com/unraveloop/JDC-AX6600-Athena-LED-Controller.git /tmp/athena_src
          cp -r /tmp/athena_src/athena-led package/athena/athena-led
          cp -r /tmp/athena_src/luci-app-athena-led package/athena/luci-app-athena-led
          rm -rf /tmp/athena_src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 10. 克隆额外插件 (iStore/OAF/Gecoos/Harbor)
        working-directory: openWRT
        run: |
          # iStore 应用商店
          git clone --depth=1 https://github.com/linkease/istore.git package/luci-app-store

          # OpenAppFilter v6.1.8
          git clone --depth=1 --branch v6.1.8 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

          # Gecoos AC 控制器
          git clone --depth=1 https://github.com/laipeng668/luci-app-gecoosac.git package/luci-app-gecoosac

          # Harbor File 文件管理器
          git clone --depth=1 https://github.com/destan19/luci-app-harbor-file.git package/luci-app-harbor-file

          # 重新扫包
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 11. 运行 diy.sh (sed 定制 + make defconfig)
        working-directory: openWRT
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 12. 验证关键包已选入配置
        working-directory: openWRT
        run: |
          echo "=== 验证 NSS ==="
          grep -E "CONFIG_TARGET_qualcommax|^CONFIG_PACKAGE_kmod-qca-nss" .config | head -5
          echo "=== 验证 athena-led ==="
          grep -E "athena-led|luci-app-athena" .config
          echo "=== 验证 4 个插件 ==="
          grep -E "luci-app-store|luci-app-openappfilter|luci-app-gecoosac|luci-app-harbor" .config
          echo "=== 验证 Rust ==="
          grep "CONFIG_RUST" .config

      - name: 13. SSH 调试 (可选)
        if: ${{ inputs.ssh == true }}
        uses: mxschmitt/action-tmate@v3

      - name: 14. 编译 (多线程)
        if: ${{ inputs.multithreading == true }}
        working-directory: openWRT
        run: |
          make download -j$(nproc)
          make -j$(nproc) V=s

      - name: 15. 编译 (单线程)
        if: ${{ inputs.multithreading == false }}
        working-directory: openWRT
        run: |
          make download -j1
          make -j1 V=s

      - name: 16. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: re-cs-02-nss-athena-full
          path: openWRT/bin/targets/qualcommax/ipq60xx/*.bin
